; XFCE top bar — replaces xfce4-panel (killed by the polybar-start autostart
; script wired in modules/home/desktops/xfce.nix). Palette taken from the
; installed Orchis-Dark theme (pkgs.unstable.orchis-theme share/themes/
; Orchis-Dark) so bar + launcher read as native GTK next to it.

[colors]
bg = #212121d9
bg-alt = #2c2c2cd9
fg = #ffffff
fg-dim = #909090
accent = #3281ea
warn = #fbc02d
urgent = #f44336

[bar/main]
width = 100%
height = 32
bottom = false
fixed-center = false
line-size = 2

background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 2

font-0 = JetBrainsMono Nerd Font:size=11;2

modules-left = xworkspaces xwindow
modules-right = pulseaudio cpu memory network date

tray-position = right
tray-maxsize = 16
tray-padding = 3
tray-background = ${colors.bg}

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
screenchange-reload = true
pseudo-transparency = true

[module/xworkspaces]
type = internal/xworkspaces
label-monitor = %name%
pin-workspaces = true

label-active = %name:0:8%
label-active-background = ${colors.bg-alt}
label-active-foreground = ${colors.accent}
label-active-underline = ${colors.accent}
label-active-padding = 1

label-urgent = %name:0:8%!%
label-urgent-background = ${colors.urgent}
label-urgent-padding = 1

label-occupied = %name:0:8%
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 1

label-empty = %name:0:2%
label-empty-foreground = ${colors.fg-dim}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:48:...%
label-empty =

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-muted = VOL muted
label-muted-foreground = ${colors.fg-dim}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = CPU %percentage%%
label-warn = CPU %percentage%%
label-warn-foreground = ${colors.warn}
warn-percentage = 90

[module/memory]
type = internal/memory
interval = 3
format = <label>
label = RAM %percentage_used%%
label-warn = RAM %percentage_used%%
label-warn-foreground = ${colors.warn}
warn-percentage = 85

[module/network]
type = internal/network
interval = 3
label-connected = %essid:0:14% ↓%downspeed% ↑%upspeed%
label-disconnected = offline
label-disconnected-foreground = ${colors.fg-dim}

[module/date]
type = internal/date
interval = 30
date = %Y-%m-%d %H:%M
format = <label>
label = %date%
